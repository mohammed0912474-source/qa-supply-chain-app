<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QA Supply Chain | Quality & Supply Chain Operations</title>
<meta name="description" content="QA Supply Chain is a professional quality and logistics operations workspace for shipments, truck inspections, product processing, analytics, and monthly reports.">
<link rel="manifest" href="manifest.json">
<link rel="preload" as="image" href="login-bg-optimized.jpg" fetchpriority="high">
<meta name="theme-color" content="#0A2540">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="QA Supply Chain">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<noscript><link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"></noscript>
<style>
:root{
  --navy:#0A2540; --navy2:#123A5E; --navy3:#0D3158;
  --accent:#2E7BD6; --accent-dark:#1E5FA8;
  --teal:#0EA5A0; --teal-dark:#0B807C; --teal-light:#E3F7F6;
  --gold:#E8AA3D; --gold-light:#FCF1DD;
  --bg:#F6F8FB; --card:#FFFFFF; --text:#172B3A; --muted:#66788A;
  --danger:#C83D4B; --danger-dark:#A92B37; --success:#1F7A58; --warn:#B87517;
  --border:#DCE4ED; --radius:10px;
  --shadow-sm:0 1px 2px rgba(15,35,65,.04);
  --shadow-md:0 2px 8px rgba(15,35,65,.06);
  --shadow-lg:0 5px 18px rgba(15,35,65,.10);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font-family:"Cairo","IBM Plex Sans","Segoe UI", Tahoma, Geneva, Arial, sans-serif;
  padding-bottom:calc(88px + env(safe-area-inset-bottom)); -webkit-tap-highlight-color:transparent;
  -webkit-font-smoothing:antialiased;
}
[dir="rtl"] body{font-family:"Cairo","IBM Plex Sans","Segoe UI", Tahoma, Arial, sans-serif;}
button{font-family:inherit; cursor:pointer;}
input,select,textarea{font-family:inherit; font-size:15px;}

/* Header */
.app-header{
  background:#102A43;
  color:#fff; padding:14px 16px 0; position:sticky; top:0; z-index:40;
  box-shadow:0 2px 8px rgba(15,35,65,.18);
}
.header-top{display:flex; align-items:center; justify-content:space-between; gap:8px; padding-bottom:12px;}
.tagline-strip{
  border-top:1px solid rgba(255,255,255,.14);
  padding:7px 4px 9px; text-align:start; font-size:11px; font-weight:600;
  color:#C6D7E7; letter-spacing:0; display:block;
}
.tagline-strip .dot{display:none;}
.app-header .brand{display:flex; align-items:center; gap:10px; min-width:0;}
.app-header .brand .logo{
  width:40px;height:40px;border-radius:8px;background:#173C5F;
  border:1px solid rgba(255,255,255,.18);
  display:flex;align-items:center;justify-content:center;font-size:21px; flex-shrink:0;
  box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.app-header .brand .titles{min-width:0;}
.app-header .brand h1{font-size:15px; margin:0; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.app-header .brand .sub{font-size:11px; opacity:.75; margin-top:1px;}
.header-actions{display:flex; align-items:center; gap:6px; flex-shrink:0;}
.icon-btn{
  background:rgba(255,255,255,.12); border:none; color:#fff; border-radius:9px;
  width:36px; height:36px; display:flex; align-items:center; justify-content:center;
  font-size:16px; position:relative;
}
.status-pill{
  font-size:10px; padding:3px 8px; border-radius:20px; display:flex; align-items:center; gap:4px;
  background:rgba(255,255,255,.1);
}
.status-dot{width:7px;height:7px;border-radius:50%;background:var(--success);}
.status-pill.offline .status-dot{background:var(--danger);}

/* Nav */
.tabbar{
  position:fixed; bottom:0; inset-inline-start:0; inset-inline-end:0; z-index:40;
  background:#fff; border-top:1px solid var(--border);
  display:flex; overflow-x:auto; padding:6px 4px calc(6px + env(safe-area-inset-bottom)); gap:2px;
  box-shadow:0 -4px 16px rgba(15,35,65,.08);
}
.tab-btn{
  flex:1 0 auto; min-width:64px; background:none; border:none; display:flex; flex-direction:column;
  align-items:center; gap:2px; padding:7px 8px 6px; border-radius:6px; color:var(--muted); font-size:10.5px;
  font-weight:600; transition:background .15s, color .15s;
}
.tab-btn .ico{font-size:19px; display:flex; align-items:center; justify-content:center;}
.tab-btn.active{color:var(--accent-dark); background:#EEF4FA; font-weight:800; box-shadow:inset 0 -2px 0 var(--accent);}

/* Layout */
.container{max-width:980px; margin:0 auto; padding:16px; padding-bottom:calc(88px + 16px + env(safe-area-inset-bottom));}
.card{background:var(--card); border-radius:var(--radius); padding:18px; margin-bottom:14px; box-shadow:var(--shadow-md); border:1px solid var(--border);}
.card h2{margin:0 0 4px; font-size:17px; color:var(--navy); font-weight:800;}
.card .desc{font-size:12.5px; color:var(--muted); margin-bottom:10px;}
.section-title{display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.section-title h2{margin:0;}

/* dashboard */
.stats-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px;}
.stat-card{background:linear-gradient(160deg,#fff, #FAFCFF); border:1px solid var(--border); border-radius:var(--radius); padding:16px 14px; text-align:center; box-shadow:var(--shadow-sm); transition:box-shadow .2s;}
.stat-card .num{font-size:25px; font-weight:900; color:var(--navy); letter-spacing:-.3px;}
.stat-card .lbl{font-size:12px; color:var(--muted); margin-top:2px;}
.stat-card .ico{font-size:22px; margin-bottom:4px;}

.kpi-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}
.kpi-card{background:#fff; border:1px solid var(--border); border-inline-start:5px solid var(--teal); border-radius:var(--radius); padding:13px 14px; box-shadow:var(--shadow-sm);}
.kpi-card.good{border-inline-start-color:var(--success);}
.kpi-card.warn{border-inline-start-color:var(--warn);}
.kpi-card.bad{border-inline-start-color:var(--danger);}
.kpi-card .kpi-val{font-size:22px; font-weight:900; color:var(--navy); letter-spacing:-.3px;}
.kpi-card .kpi-lbl{font-size:11.5px; color:var(--muted); margin-top:3px; line-height:1.4; font-weight:600;}
.period-toggle{display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
.period-toggle button.active{background:var(--teal); color:#fff;}
.chart-card{margin-top:6px;}
.chart-card h3{font-size:13.5px; color:var(--navy2); margin:0 0 10px; font-weight:800;}

/* Section backgrounds */
.section-hero{position:relative;height:240px;border-radius:var(--radius);margin-bottom:16px;overflow:hidden;box-shadow:var(--shadow-lg);background-size:cover;background-position:center;}
.section-hero::before{content:'';position:absolute;inset:0;background:linear-gradient(135deg,rgba(10,37,64,.75) 0%,rgba(30,95,168,.65) 100%);z-index:1;}
.section-hero .hero-content{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:flex-end;padding:20px;color:#fff;}
.section-hero .hero-title{font-size:28px;font-weight:900;margin:0;text-shadow:0 2px 8px rgba(0,0,0,.3);}
.section-hero .hero-subtitle{font-size:13px;opacity:.9;margin-top:4px;text-shadow:0 1px 4px rgba(0,0,0,.2);}
.section-hero.shipment-bg{background-image:url('shipment-bg.jpg');}
.section-hero.trucks-bg{background-image:url('trucks-bg.jpg');}
.section-hero.reback-bg{background-image:url('reback-bg.jpg');}
@media (max-width:600px){.section-hero{height:180px;}.section-hero .hero-title{font-size:22px;}}

/* Buttons */
.btn{border:none; border-radius:8px; padding:10px 16px; font-size:14px; font-weight:700; display:inline-flex; align-items:center; gap:6px; transition:transform .08s, box-shadow .15s;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent-dark); color:#fff; box-shadow:0 1px 3px rgba(30,95,168,.26);}
.btn-primary:active{background:var(--accent-dark);}
.btn-outline{background:#fff; color:var(--accent-dark); border:1.5px solid var(--accent);}
.btn-danger{background:#FCEAEA; color:var(--danger-dark); border:1.5px solid #F3C6C6;}
.btn-success{background:#E7F5EE; color:var(--success); border:1.5px solid #BEE3D0;}
.btn-sm{padding:6px 10px; font-size:12.5px; border-radius:7px;}
.btn-block{width:100%; justify-content:center;}
.btn:disabled{opacity:.5;}

/* Forms */
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
@media (max-width:560px){.form-grid{grid-template-columns:1fr;}}
.grid-2{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
@media (max-width:768px){.grid-2{grid-template-columns:1fr;}}
.field{margin-bottom:2px;}
.field label{display:block; font-size:12.5px; font-weight:700; color:var(--navy2); margin-bottom:4px;}
.field .req{color:var(--danger);}
.field input[type=text], .field input[type=number], .field input[type=date], .field input[type=tel], .field input[type=password],
.field select, .field textarea{
  width:100%; padding:10px 11px; border:1px solid var(--border); border-radius:7px; background:#FFFFFF; color:var(--text);
}
.field textarea{min-height:60px; resize:vertical;}
.field input:focus, .field select:focus, .field textarea:focus{outline:none; border-color:var(--accent);}
.field-full{grid-column:1 / -1;}
.hint{font-size:11px; color:var(--muted); margin-top:3px;}
.draft-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;margin:0 0 12px;background:var(--teal-light);border:1px solid #B9E7E4;border-radius:9px;color:var(--teal-dark);font-size:11.5px;font-weight:700;}
.draft-strip .draft-meta{display:flex;align-items:center;gap:6px;}

/* Groups (repeatable) */
.group-block{grid-column:1/-1; border:1.5px dashed var(--border); border-radius:10px; padding:10px; margin:6px 0; background:#FAFBFD;}
.group-header{display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;}
.group-header b{font-size:13px; color:var(--navy);}
.group-item{background:#fff; border:1px solid var(--border); border-radius:9px; padding:10px; margin-bottom:8px; position:relative;}
.group-item .grid-mini{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
@media (max-width:480px){.group-item .grid-mini{grid-template-columns:1fr;}}
.group-item .rm-row{display:flex; justify-content:flex-end; margin-top:6px;}
.chip{display:inline-block; background:#EAF2FC; color:var(--accent-dark); font-size:11px; font-weight:700; border-radius:6px; padding:2px 7px; margin-inline-end:6px;}

/* multiDate rows */
.md-row{display:flex; gap:8px; align-items:center; margin-bottom:6px; flex-wrap:wrap;}
.md-row input{flex:1; min-width:120px;}

/* images */
.img-grid{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px;}
.img-thumb{position:relative; width:74px; height:74px; border-radius:8px; overflow:hidden; border:1px solid var(--border); background:#f2f2f2;}
.img-thumb img{width:100%; height:100%; object-fit:cover; display:block;}
.img-thumb .rm{position:absolute; top:2px; inset-inline-end:2px; background:rgba(214,69,69,.9); color:#fff; border:none; border-radius:50%; width:18px; height:18px; font-size:11px; line-height:1;}
.file-btn{display:inline-flex; align-items:center; gap:6px; background:#EAF2FC; color:var(--accent-dark); border:1.5px dashed var(--accent); border-radius:9px; padding:9px 12px; font-size:13px; font-weight:700; cursor:pointer;}
.file-btn input{display:none;}

/* computed display */
.computed-box{background:#EAF2FC; border:1.5px solid var(--accent); border-radius:8px; padding:10px 12px; font-weight:800; color:var(--navy); font-size:16px;}

/* List / table */
.toolbar{display:flex; gap:8px; margin-bottom:10px; flex-wrap:wrap; align-items:center;}
.toolbar input[type=text],.toolbar input[type=date]{padding:8px 10px; border:1.5px solid var(--border); border-radius:8px; font-size:13px;}
.record-card{background:#fff; border:1px solid var(--border); border-radius:9px; padding:14px; margin-bottom:9px; box-shadow:var(--shadow-sm); transition:box-shadow .15s;}
.record-card .top{display:flex; justify-content:space-between; gap:8px; align-items:flex-start;}
.record-card .main{font-size:13.5px; font-weight:700; color:var(--navy);}
.record-card .meta{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.5;}
.record-card .actions{display:flex; gap:6px; flex-shrink:0;}
.operations-shell{display:flex;flex-direction:column;gap:14px;}
.workspace-header{background:var(--navy);color:#fff;border-radius:12px;padding:22px;display:flex;justify-content:space-between;align-items:flex-start;gap:16px;box-shadow:var(--shadow-md);}
.workspace-kicker{font-size:11px;font-weight:800;letter-spacing:.4px;color:#9FC8ED;text-transform:uppercase;margin-bottom:6px;}
.workspace-title{font-size:25px;line-height:1.25;font-weight:900;margin:0;}
.workspace-description{font-size:12.5px;line-height:1.65;color:#D3E1ED;margin:7px 0 0;max-width:620px;}
.workspace-header .btn-primary{background:#fff;color:var(--navy);box-shadow:none;white-space:nowrap;}
.workspace-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}
.workspace-metric{background:#fff;border:1px solid var(--border);border-radius:9px;padding:13px 14px;}
.workspace-metric .value{display:block;color:var(--navy);font-size:22px;font-weight:900;line-height:1;}.workspace-metric .label{display:block;color:var(--muted);font-size:11px;font-weight:700;margin-top:7px;}
.filter-panel{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;box-shadow:var(--shadow-sm);}
.filter-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;}.filter-panel-title{font-size:14px;font-weight:800;color:var(--navy);margin:0;}.filter-panel-note{font-size:11px;color:var(--muted);}
.filter-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;}.filter-field{display:flex;flex-direction:column;gap:5px;}.filter-field label{font-size:11px;font-weight:800;color:var(--navy2);}
.filter-field input,.filter-field select{width:100%;height:39px;background:#fff;border:1px solid var(--border);border-radius:7px;padding:8px 10px;color:var(--text);font-family:inherit;font-size:12.5px;}.filter-field input:focus,.filter-field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,123,214,.11);}
.filter-footer{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--border);flex-wrap:wrap;}.filter-results{font-size:12px;color:var(--muted);}.filter-results b{color:var(--navy);font-size:14px;}.filter-actions{display:flex;gap:7px;flex-wrap:wrap;}
.btn-quiet{background:#F6F8FB;color:var(--navy2);border:1px solid var(--border);}
.records-panel{background:#fff;border:1px solid var(--border);border-radius:10px;overflow:hidden;box-shadow:var(--shadow-sm);}.records-panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--border);}.records-panel-title{font-size:14px;font-weight:900;color:var(--navy);}.records-panel-sub{font-size:11px;color:var(--muted);margin-top:3px;}
.records-table-wrap{overflow-x:auto;}.records-table{width:100%;border-collapse:collapse;min-width:760px;}.records-table th{background:#F8FAFC;color:#65758A;font-size:10.5px;font-weight:800;text-align:start;padding:11px 14px;border-bottom:1px solid var(--border);white-space:nowrap;}.records-table td{padding:13px 14px;border-bottom:1px solid #EDF1F5;color:var(--text);font-size:12.5px;vertical-align:middle;}.records-table tr:last-child td{border-bottom:none;}.records-table tbody tr:hover{background:#FAFCFE;}
/* ---- Manual work status: one colour system across every section ---- */
.records-table tbody tr.row-completed td:first-child{box-shadow:inset 4px 0 0 0 var(--success);}
.records-table tbody tr.row-working td:first-child{box-shadow:inset 4px 0 0 0 var(--warn);}
html[dir="rtl"] .records-table tbody tr.row-completed td:first-child{box-shadow:inset -4px 0 0 0 var(--success);}
html[dir="rtl"] .records-table tbody tr.row-working td:first-child{box-shadow:inset -4px 0 0 0 var(--warn);}
.records-table tbody tr.row-completed{background:rgba(31,122,88,.045);}
.records-table tbody tr.row-working{background:rgba(184,117,23,.05);}
.records-table tbody tr.row-completed:hover{background:rgba(31,122,88,.085);}
.records-table tbody tr.row-working:hover{background:rgba(184,117,23,.095);}
.work-toggle{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:5px 11px;font-size:11.5px;font-weight:800;cursor:pointer;white-space:nowrap;transition:filter .15s ease,transform .1s ease;font-family:inherit;}
.work-toggle .work-dot{width:7px;height:7px;border-radius:50%;flex:none;}
.work-toggle.completed{background:#E7F5EE;color:var(--success);border:1.5px solid #BEE3D0;}
.work-toggle.completed .work-dot{background:var(--success);}
.work-toggle.working{background:#FDF3E3;color:var(--warn);border:1.5px solid #F0DBB4;}
.work-toggle.working .work-dot{background:var(--warn);animation:workPulse 1.8s ease-in-out infinite;}
.work-toggle:hover{filter:brightness(.97);}
.work-toggle:active{transform:scale(.97);}
.work-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
@keyframes workPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
@media (prefers-reduced-motion:reduce){.work-toggle.working .work-dot{animation:none;}}
.analytics-basis{margin-top:7px;font-size:11.5px;font-weight:700;color:var(--accent-dark);background:#EEF5FD;border:1px solid #D5E6F8;border-radius:8px;padding:7px 10px;line-height:1.5;}
.kpi-card .kpi-formula{font-size:10px;color:var(--muted);margin-top:5px;font-weight:700;opacity:.85;direction:ltr;text-align:start;}
.record-primary{font-weight:800;color:var(--navy);font-size:13px;}.record-secondary{color:var(--muted);font-size:11px;margin-top:3px;line-height:1.45;}.record-product{max-width:230px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}.status-badge{display:inline-flex;align-items:center;padding:4px 8px;border-radius:999px;font-size:10.5px;font-weight:800;white-space:nowrap;}.status-badge.good{background:#E8F5EE;color:#1F7454;}.status-badge.warn{background:#FFF5DF;color:#9D6711;}.status-badge.bad{background:#FCEAEC;color:#A52D39;}.status-badge.neutral{background:#EEF3F8;color:#5D6E80;}.record-actions{display:flex;justify-content:flex-end;gap:5px;}  .record-actions .btn{padding:6px 8px;font-size:11px;}
.detail-workspace{display:flex;flex-direction:column;gap:14px;}.detail-header{background:#102A43;color:#fff;border-radius:12px;padding:22px;display:flex;justify-content:space-between;gap:14px;align-items:flex-start;}.detail-header h1{color:#fff;margin:6px 0;font-size:24px;}.detail-header p{color:#D3E1ED;margin:0;font-size:12px;}.detail-header .btn{background:#fff;color:#102A43;}.detail-summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;}.detail-item{background:#fff;border:1px solid var(--border);border-radius:9px;padding:12px;display:flex;flex-direction:column;gap:5px;min-width:0;}.detail-label{font-size:11px;color:var(--muted);font-weight:700;}.detail-value{font-size:13px;color:var(--navy);overflow-wrap:anywhere;}.detail-section{background:#fff;border:1px solid var(--border);border-radius:10px;padding:16px;}.detail-section h3{margin:0 0 12px;color:var(--navy);font-size:15px;}.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;}.detail-subgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}.detail-subcard{background:#F5F8FB;border:1px solid #E1E8EF;border-radius:8px;padding:10px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;}.detail-subcard .detail-subtitle{grid-column:1/-1;color:var(--accent-dark);font-size:12px;font-weight:900;}.detail-images{display:flex;flex-wrap:wrap;gap:10px;}.detail-image{width:140px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--border);}.detail-footer{display:flex;justify-content:flex-end;gap:8px;padding-top:4px;}@media(max-width:600px){.detail-header{flex-direction:column;}.detail-header .btn{width:100%;justify-content:center;}.detail-summary,.detail-grid,.detail-subgrid{grid-template-columns:1fr;}.detail-subcard{grid-template-columns:1fr 1fr;}.detail-footer{flex-direction:column-reverse;}.detail-footer .btn{width:100%;justify-content:center;}}
